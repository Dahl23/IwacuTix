<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA114" />
      <stop offset="45%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF2E00" />
    </linearGradient>
    <filter id="ticketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#FF6B00" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep dark app background with rounded corners for preview / standard icon -->
  <rect width="512" height="512" fill="#090A0F" rx="115" />
  
  <!-- Subtle circular radiant glow -->
  <circle cx="256" cy="220" r="180" fill="url(#brandGrad)" opacity="0.12" />

  <!-- Speed Motion Streaks -->
  <g stroke="url(#brandGrad)" stroke-linecap="round" opacity="0.95">
    <line x1="85" y1="165" x2="145" y2="150" stroke-width="12" />
    <line x1="60" y1="210" x2="160" y2="185" stroke-width="14" />
    <line x1="95" y1="255" x2="170" y2="242" stroke-width="12" />
  </g>

  <!-- Flying Ticket with Notches, Perforations & Star Cutout -->
  <g transform="translate(305, 195) rotate(-14)" filter="url(#ticketGlow)">
    <!-- Ticket Body -->
    <path d="M -105,-70 
             L 75,-70 
             A 20,20 0 0,0 75,-30 
             L 75,30 
             A 20,20 0 0,0 75,70 
             L -105,70 
             A 22,22 0 0,0 -105,28 
             L -105,-28 
             A 22,22 0 0,0 -105,-70 Z" 
          fill="url(#brandGrad)" />
    
    <!-- Perforation line -->
    <line x1="38" y1="-64" x2="38" y2="64" stroke="#090A0F" stroke-width="6.5" stroke-dasharray="9 9" opacity="0.85" stroke-linecap="round" />

    <!-- Cutout Star inside ticket -->
    <polygon points="-32,-35 -23,-12 -2,-12 -19,4 -12,26 -32,13 -52,26 -45,4 -62,-12 -41,-12" fill="#090A0F" />
  </g>

  <!-- Brand Typography: IwacuTix -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1.5">
    Iwacu<tspan fill="url(#brandGrad)">Tix</tspan>
  </text>
  <!-- Subtitle BURUNDI -->
  <text x="256" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFA114" letter-spacing="5">
    BURUNDI
  </text>
</svg>