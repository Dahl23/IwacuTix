<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9000" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#E03000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" fill="#0B0F19" rx="110" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="url(#pwaGrad)" stroke-width="6" opacity="0.25" />

  <!-- Speed Motion Streaks -->
  <g stroke="url(#pwaGrad)" stroke-linecap="round" opacity="0.9">
    <line x1="120" y1="190" x2="170" y2="180" stroke-width="12" />
    <line x1="100" y1="225" x2="185" y2="205" stroke-width="14" />
    <line x1="135" y1="250" x2="195" y2="240" stroke-width="12" />
  </g>

  <!-- Ticket Body with Notches -->
  <g transform="translate(295, 185) rotate(-16)">
    <!-- Ticket Body -->
    <path d="M -90,-60 
             L 65,-60 
             A 16,16 0 0,0 65,-28 
             L 65,28 
             A 16,16 0 0,0 65,60 
             L -90,60 
             A 18,18 0 0,0 -90,24 
             L -90,-24 
             A 18,18 0 0,0 -90,-60 Z" 
          fill="url(#pwaGrad)" rx="16" />
    
    <!-- Perforation line -->
    <line x1="32" y1="-56" x2="32" y2="56" stroke="#0B0F19" stroke-width="6" stroke-dasharray="8 8" opacity="0.8" stroke-linecap="round" />

    <!-- Cutout Star inside ticket -->
    <polygon points="-28,-30 -20,-10 -2,-10 -17,4 -11,23 -28,12 -45,23 -39,4 -54,-10 -36,-10" fill="#0B0F19" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-1.5">
    Iwacu<tspan fill="url(#pwaGrad)">Tix</tspan>
  </text>
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="16" fill="#94A3B8" letter-spacing="4">
    BURUNDI
  </text>
</svg>
